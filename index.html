<script>
    const MONTHLY_RATE_UG = 0.095;
    let loanState = { amount: 500000, duration: 90, monthly: 0, total: 0, interest: 0 };

    function formatMoneyUGX(amount) { return 'UGX ' + Math.round(amount).toLocaleString('en-UG'); }

    function updateCalculator() {
      const months = loanState.duration / 30;
      loanState.interest = Math.round(loanState.amount * MONTHLY_RATE_UG * months);
      loanState.total = loanState.amount + loanState.interest;
      loanState.monthly = Math.ceil(loanState.total / months);
      document.getElementById('amountDisplay').innerHTML = formatMoneyUGX(loanState.amount);
      document.getElementById('durationDisplay').innerHTML = months + ' Month' + (months > 1 ? 's' : '');
      document.getElementById('monthlyPayment').innerHTML = formatMoneyUGX(loanState.monthly);
      document.getElementById('totalRepayment').innerHTML = formatMoneyUGX(loanState.total);
      document.getElementById('rateNote').innerHTML = `Rate: 9.5% per month · ${months} month${months > 1 ? 's' : ''} · Interest ${formatMoneyUGX(loanState.interest)}`;
      updateActivePreset();
    }

    function setAmount(value) {
      loanState.amount = Math.max(100000, Math.min(5000000, value));
      document.getElementById('loanAmount').value = loanState.amount;
      document.getElementById('amountRange').value = loanState.amount;
      updateCalculator();
    }
    function syncAmountFromInput() { setAmount(parseInt(document.getElementById('loanAmount').value)); }
    function syncAmountFromRange() { setAmount(parseInt(document.getElementById('amountRange').value)); }
    function setPresetAmount(amount) { setAmount(amount); }
    function updateActivePreset() {
      const presets = [200000, 500000, 1000000, 2500000];
      document.querySelectorAll('.preset-btn').forEach((btn, idx) => { if(presets[idx] === loanState.amount) btn.classList.add('active'); else btn.classList.remove('active'); });
    }
    function selectDuration(days) {
      loanState.duration = days;
      const months = days / 30;
      document.querySelectorAll('.duration-btn').forEach(btn => { let btnMonths = parseInt(btn.getAttribute('data-months')); if(btnMonths === months) btn.classList.add('active'); else btn.classList.remove('active'); });
      updateCalculator();
    }
    function toggleMobileMenu() { document.getElementById('mobileNav').classList.toggle('open'); document.getElementById('menuBtn').classList.toggle('open'); }
    function closeMobileMenu() { document.getElementById('mobileNav').classList.remove('open'); document.getElementById('menuBtn').classList.remove('open'); }
    function toggleStep(card) { card.classList.toggle('open'); }
    function toggleFaq(element) { element.closest('.faq-item').classList.toggle('open'); }
    
    function redirectToLogin() {
      const calculatorData = {
        amount: loanState.amount,
        duration: loanState.duration,
        monthly: loanState.monthly,
        total: loanState.total,
        interest: loanState.interest,
        currency: 'UGX'
      };
      sessionStorage.setItem('calculatorData', JSON.stringify(calculatorData));
      // Use relative path - works on any domain
      window.location.href = 'verify.html';
    }
    
    document.getElementById('loanAmount')?.addEventListener('input', syncAmountFromInput);
    document.getElementById('amountRange')?.addEventListener('input', syncAmountFromRange);
    document.querySelectorAll('a[href^="#"]').forEach(anchor => { anchor.addEventListener('click', function(e) { e.preventDefault(); const target = document.querySelector(this.getAttribute('href')); if(target) { target.scrollIntoView({ behavior: 'smooth', block: 'start' }); closeMobileMenu(); } }); });
    updateCalculator();
  </script>
